# Render Blueprint: https://render.com/docs/blueprint-spec
# Free tier: the filesystem is ephemeral, so the SQLite file on the instance is wiped on each
# deploy, restart and idle spin-down. A free Render Postgres database keeps a snapshot of it:
# the app restores the snapshot at boot and saves a fresh one a few seconds after every change
# (see server/persist.js).
services:
  - type: web
    name: ferguson-training-quiz
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Signs trainer sign-in cookies. Keeping it stable means trainers stay signed in across
      # deploys and restarts; without it a fresh secret is generated on every start.
      - key: SESSION_SECRET
        generateValue: true
      # Durable copy of the database (server/persist.js): the *internal* connection string of
      # the Render Postgres database "campustraining", pasted in the dashboard (never committed).
      # Remove the variable to run on the ephemeral disk alone.
      - key: DATABASE_URL
        sync: false
      # PUBLIC_URL is taken from RENDER_EXTERNAL_URL automatically; set it here only
      # if you put a custom domain in front of the service.
      # - key: PUBLIC_URL
      #   value: https://quiz.example.com
    # To keep data between restarts, move to a paid instance and uncomment:
    # plan: starter
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: DB_PATH
    #     value: /var/data/daily-quiz.sqlite

# The Postgres database (free plan, created by hand in the dashboard as "campustraining") is not
# managed here so a Blueprint sync never recreates it. Free Postgres expires 30 days after
# creation: download the snapshot (scripts/snapshot.mjs) before then.
